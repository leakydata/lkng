[workspace]

[package]
name = "lkng-web"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
lkng-app = { path = "../rust/lkng-app" }
lkng-identity = { path = "../rust/lkng-identity" }
lkng-presence = { path = "../rust/lkng-presence" }
lkng-inbox = { path = "../rust/lkng-inbox" }
lkng-moderation = { path = "../rust/lkng-moderation" }
lkng-album = { path = "../rust/lkng-album" }
lkng-profile = { path = "../rust/lkng-profile" }
blake3 = "1"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dioxus = { version = "0.7", features = ["web"] }
lkng-location = { path = "../rust/lkng-location" }
web-sys = { version = "0.3", features = [
  "Window", "Location", "WebSocket", "BinaryType", "Storage",
  "Document", "Element", "HtmlCanvasElement", "HtmlImageElement",
  "CanvasRenderingContext2d", "Blob", "Url", "File", "FileList",
  "HtmlInputElement", "Event", "EventTarget",
] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wasm-bindgen = "0.2"
gloo-timers = { version = "0.3", features = ["futures"] }
freenet-stdlib = { version = "0.8.5", features = ["net"] }
# Two getrandom majors reach this build: 0.3 directly, 0.2 transitively
# (argon2/chacha20poly1305 via rand_core 0.6). Each needs its own browser
# backend feature enabled or the wasm target refuses to compile.
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

# Optimise the wasm for size, not speed.
#
# This binary is fetched over Freenet by every user, on a phone, and
# re-fetched on every UI update — and the peers that carry it did not ask
# for it. That makes bundle size a cost paid by other people's data
# allowances, which is precisely the thing this project claims not to do.
#
# It nearly doubled in one evening (3.6 MB -> 6.7 MB) as messaging, albums
# and moderation landed, so this is not premature.
#
# `opt-level = "z"` over `"s"`: nothing here is compute-bound. The heaviest
# operation is an ML-DSA verification measured in milliseconds, and a user
# waiting on a download notices megabytes long before they notice that.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
