[workspace]

[package]
name = "presence-cell"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/leakydata/lkng"

[dependencies]
freenet-stdlib = { version = "0.8.5", features = ["contract"] }
lkng-presence = { path = "../../rust/lkng-presence" }
blake3 = "1"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
contract = ["freenet-stdlib/contract"]
default = ["freenet-main-contract", "contract"]
freenet-main-contract = []
trace = ["freenet-stdlib/trace"]
