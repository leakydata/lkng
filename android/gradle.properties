org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true
kotlin.code.style=official

# Build with JDK 21, not the system default.
#
# Kotlin 2.0.21's compiler parses the JVM version string with a routine that
# does not understand a bare major version of 25, and throws
# `IllegalArgumentException: 25.0.3` before compiling anything.
#
# The failure mode is worse than a broken build: while every output happened
# to be up-to-date, `gradle assembleDebug` reported BUILD SUCCESSFUL and
# produced an APK -- the previous one. Kotlin had not compiled in some time
# and nothing said so. Pinning the toolchain here makes the build either work
# or fail, rather than silently skip.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64
