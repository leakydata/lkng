[workspace]
resolver = "2"
members = [
    "rust/lkng-app",
    "rust/lkng-identity",
    "rust/lkng-inbox",
    "rust/lkng-location",
    "rust/lkng-moderation",
    "rust/lkng-album",
    "rust/lkng-presence",
    "rust/lkng-profile",
    "rust/lkng-transport",
    "rust/lkng-transport-freenet",
    "rust/lkng-transport-mock",
]
# NOTE: contracts/* are deliberately NOT workspace members — fdev requires
# each contract to be its own workspace root (ecosystem convention: Mail and
# Delta contracts each carry their own Cargo.lock).
exclude = ["contracts"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/lkng-app/lkng"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
