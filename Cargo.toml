[workspace]
resolver = "2"
members = [
    "rust/lkng-transport",
    "rust/lkng-transport-mock",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/lkng-app/lkng"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
