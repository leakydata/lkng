[package]
name = "lkng-album"
version = "0.1.0"
description = "Private albums: ciphertext on the network, keys shared per person"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1"
ciborium = "0.2"
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
thiserror = { workspace = true }

[features]
default = ["verify"]
verify = ["dep:ml-dsa"]
