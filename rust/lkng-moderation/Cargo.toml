[package]
name = "lkng-moderation"
version = "0.1.0"
description = "Signed reports as Atlas-shaped descriptors, in feeds users choose to trust"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1"
ciborium = "0.2"
freenet-scaffold = "0.2.2"
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
thiserror = { workspace = true }

[dev-dependencies]
proptest = "1"

[features]
default = ["verify"]
verify = ["dep:ml-dsa"]
