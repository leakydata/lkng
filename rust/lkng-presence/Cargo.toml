[package]
name = "lkng-presence"
version = "0.1.0"
description = "Presence-cell state: anyone-writes records with commutative capped merge (Raven index-shard pattern)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1"
ciborium = "0.2"
freenet-scaffold = "0.2.2"
# Verification only (no RNG, no key generation) so this compiles to
# wasm32-unknown-unknown for in-contract signature checking.
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
thiserror = { workspace = true }

[dev-dependencies]
proptest = "1"

[features]
default = ["verify"]
verify = ["dep:ml-dsa"]
