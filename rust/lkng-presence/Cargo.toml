[package]
name = "lkng-presence"
version = "0.1.0"
description = "Presence-cell state: anyone-writes records with commutative capped merge (Raven index-shard pattern)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1"
ciborium = "0.2"
freenet-scaffold = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
thiserror = { workspace = true }

[dev-dependencies]
proptest = "1"
